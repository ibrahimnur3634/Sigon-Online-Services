<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07152f">
    <title>Offline | Sigon Earn</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            background: radial-gradient(circle at 50% 35%, #12315e, #07152f 65%);
            color: #e2e8f0;
            font: 16px/1.7 system-ui, sans-serif;
            text-align: center;
        }
        main { width: min(100%, 440px); }
        .logo { color: #fff; font-size: 32px; font-weight: 800; letter-spacing: .1em; }
        .logo span { color: #22d3ee; }
        h1 { margin: 28px 0 8px; color: #fff; font-size: 26px; }
        p { color: #b8c8dd; }
        a {
            display: inline-block;
            margin-top: 12px;
            padding: 12px 20px;
            border-radius: 9px;
            background: #1677ff;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <div class="logo">SIGON<span>.</span></div>
        <h1>You're offline</h1>
        <p>Reconnect to the internet to continue using Sigon Earn. Your account information is never stored for offline use.</p>
        <a href="./index.html">Try again</a>
    </main>
</body>
</html>
